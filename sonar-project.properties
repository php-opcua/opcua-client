sonar.projectKey=php-opcua_opcua-client
sonar.organization=php-opcua

sonar.sources=src
sonar.tests=tests
sonar.exclusions=.github/**

sonar.php.coverage.reportPaths=coverage/clover.xml

# S115 (constant naming): the PascalCase constants in src/Types mirror the
# names defined by the OPC UA specification (StatusCode::BadTimeout,
# AttributeId::Value, ...) on purpose.
sonar.issue.ignore.multicriteria=s115types
sonar.issue.ignore.multicriteria.s115types.ruleKey=php:S115
sonar.issue.ignore.multicriteria.s115types.resourceKey=src/Types/*.php
