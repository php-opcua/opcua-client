name: Tests

on:
  push:
    branches: [ main, master, v4.5.x ]
  pull_request:
    branches: [ main, master ]

jobs:
  format:
    if: ${{ !startsWith(github.event.head_commit.message, '[DOC]') }}
    runs-on: ubuntu-latest
    continue-on-error: true
    name: Format check
    steps:
      - uses: actions/checkout@v6
      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: openssl, sockets
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Check code style
        run: composer format:check

  phpstan:
    if: ${{ !startsWith(github.event.head_commit.message, '[DOC]') }}
    runs-on: ubuntu-latest
    name: PHPStan
    steps:
      - uses: actions/checkout@v6
      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: openssl, sockets
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run static analysis
        run: composer phpstan

  unit:
    if: ${{ !cancelled() && needs.phpstan.result == 'success' && !startsWith(github.event.head_commit.message, '[DOC]') }}
    needs: [ format, phpstan ]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        php-version: [ '8.2', '8.3', '8.4', '8.5' ]

    name: Unit — PHP ${{ matrix.php-version }} (${{ matrix.os }})

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: openssl, sockets
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run unit tests
        run: composer test:unit

  integration:
    if: ${{ !startsWith(github.event.head_commit.message, '[DOC]') }}
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        php-version: [ '8.2', '8.3', '8.4', '8.5' ]

    name: Integration — PHP ${{ matrix.php-version }}

    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: the SonarQube scanner needs it for blame data and
          # new-code detection.
          fetch-depth: 0

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: openssl, sockets
          coverage: ${{ matrix.php-version == '8.5' && 'xdebug' || 'none' }}

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Start OPC UA test servers
        id: opcua
        uses: php-opcua/uanetstandard-test-suite@v1.5.2

      - name: Start extra OPC UA test suite
        uses: php-opcua/extra-test-suite@v1.2.0

      - name: Run tests
        env:
          OPCUA_CERTS_DIR: ${{ steps.opcua.outputs.certs-dir }}
        run: composer ${{ matrix.php-version == '8.5' && 'test' || 'test:integration' }} -- --log-junit=results/junit.xml ${{ matrix.php-version == '8.5' && '--coverage-clover=coverage/clover.xml' || '' }}

      - name: Upload coverage to Codecov
        if: matrix.php-version == '8.5'
        uses: codecov/codecov-action@v6
        with:
          files: coverage/clover.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: SonarQube scan
        if: matrix.php-version == '8.5'
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v6
        with:
          files: results/junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: test-results
          disable_search: true

      - name: UA-.NETStandard server logs (on failure)
        if: failure()
        working-directory: .uanetstandard-test-suite
        run: docker compose logs --tail=100

      - name: extra-test-suite server logs (on failure)
        if: failure()
        run: docker logs opcua-extra-nm --tail=200 || true
